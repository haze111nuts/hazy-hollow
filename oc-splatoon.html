<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Splatoon OCs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="oc-splatoon.css">
</head>
<body>
<script>
  (function () {
    if (sessionStorage.getItem("oc_returning")) {
      var color = sessionStorage.getItem("oc_returnColor") || "#7c9473";
      var overlay = document.createElement("div");
      overlay.id = "oc-return-overlay";
      overlay.style.position = "fixed";
      overlay.style.top = "0";
      overlay.style.left = "0";
      overlay.style.width = "100vw";
      overlay.style.height = "100vh";
      overlay.style.background = color;
      overlay.style.zIndex = "999";
      overlay.style.borderRadius = "0px";
      document.documentElement.appendChild(overlay);
    }
  })();
</script>

<main class="splat-page">
  <a class="back-link" href="index.html">&larr; back to index</a>

  <header class="splat-header">
    <h1 class="splat-title">Splatoon OCs</h1>
    <div class="splat-view-toggle" role="group" aria-label="View">
      <button class="splat-view-btn is-active" type="button" data-view="team">By team</button>
      <button class="splat-view-btn" type="button" data-view="all">All</button>
    </div>
  </header>

  <div id="splat-grid" class="splat-grid"></div>
</main>


<script src="common.js"></script>
<script src="data/oc-splatoon.js"></script>
<script src="oc-splatoon.js"></script>
</body>
</html>
