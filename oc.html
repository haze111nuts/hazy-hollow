  <script>
    function updateOpacity() {
      let container = $('.inner');
      let center = container.height() / 2;
      let closestItem = null;
      let closestDistance = Infinity;

      $('.au_list ul li').each(function () {
        let item = $(this);
        let itemCenter =
          item.position().top +
          item.outerHeight() / 2;

        let distance = Math.abs(center - itemCenter);

        // 記錄最靠近中心的
        if (distance < closestDistance) {
          closestDistance = distance;
          closestItem = item;
        }

        let maxDistance = container.height() / 2;
        let opacity = 1 - (distance / maxDistance)-0.2;
        opacity = Math.max(0.05, opacity);
        item.css('opacity', opacity);
      });

      // 中心連結透明度1
      if (closestItem)
        closestItem.css('opacity', 1)
    }

    $(document).ready(function () {
      $('.au_list ul li a').click(function (e) {
        // e.preventDefault();
        let li = $(this).parent();
        $('.au_list ul li').removeClass('active');
        li.addClass('active');

        let container = $('.inner');
        let itemTop = li.position().top;
        let containerHeight = container.height();
        let itemHeight = li.outerHeight();
        li[0].scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      });

      $('.inner').on('scroll', updateOpacity);
      updateOpacity();
    });

    const container = $('.inner');
    let isDown = false;
    let startY;
    let startScroll;

    container.on('mousedown', function (e) {
      isDown = true;
      startY = e.pageY;
      startScroll = container.scrollTop();
      container.css({
        'cursor':'grabbing',
        'scroll-snap-type':'none'   // 關閉 snap
      });

    });

    $(document).on('mousemove', function (e) {
      if (!isDown) return;
      let dy = e.pageY - startY;
      container.scrollTop(startScroll - dy);

    });

    $(document).on('mouseup', function () {
      isDown = false;
      container.css({
        'cursor':'grab',
        'scroll-snap-type':'y mandatory'  // 恢復 snap
      });
    });

  </script>
